name: BIG-T-FREE-AI

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Question for BIG-T-FREE-AI"
        required: true

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUESTION: ${{ github.event.inputs.question }}
        run: |

          RESPONSE=$(curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -d "{
              \"contents\": [
                {
                  \"parts\": [
                    {
                      \"text\": \"$QUESTION\"
                    }
                  ]
                }
              ]
            }")

          ANSWER=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

          jq -n \
            --arg answer "$ANSWER" \
            '{answer:$answer}' \
            > answer.json

      - name: Commit Answer
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add answer.json

          git commit -m "Update answer" || true

          git push
