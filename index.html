<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BIG-T-FREE-AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
}

#version{
    position: fixed;
    top: 10px;
    right: 10px;
    background: #ffff99;
    border: 1px solid #666;
    padding: 6px 12px;
    font-weight: bold;
    font-size: 16px;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:400px;
    margin-top:20px;
    padding:10px;
    font-family:Consolas, monospace;
    font-size:14px;
}
</style>
</head>

<body>

<div id="version"></div>

<h1>BIG-T-FREE-AI</h1>

<div class="row">
    <input
        id="question"
        placeholder="Ask BIG-T-FREE-AI anything">
    <button onclick="askBIGT()">ASK</button>
</div>

<textarea id="answer"></textarea>

<br><br>

<button onclick="testApi()">Testaa Oracle API</button>

<div id="result" style="margin-top:20px;font-weight:bold"></div>

<script>

const OWNER = "TuomasKare";
const REPO = "BIG-T-FREE-AI";

const d = new Date(document.lastModified);

document.getElementById("version").innerText =
    "Build " +
    d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0') +
    "." +
    String(d.getHours()).padStart(2,'0') +
    String(d.getMinutes()).padStart(2,'0');

const TOKEN = "PASTE_YOUR_GITHUB_PAT_HERE";

const TOKEN = "PASTE_YOUR_GITHUB_PAT_HERE";

async function askBIGT()
{
    const answerBox =
        document.getElementById("answer");

    answerBox.value =
`VERSION 4

Repository: ${OWNER}/${REPO}

Token length: ${TOKEN.length}

Starting workflow...
`;

    try
    {
        const response =
            await fetch(
                `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/BIG-T-FREE-AI.yml/dispatches`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${TOKEN}`,
                        "Accept": "application/vnd.github+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        ref: "main",
                        inputs: {
                            question:
                                document.getElementById("question").value
                        }
                    })
                }
            );

        const text =
            await response.text();

        answerBox.value +=
`\nHTTP Status: ${response.status}

Response:

${text}
`;

    }
    catch(error)
    {
        answerBox.value +=
`\nERROR:

${error}
`;
    }
}

async function testApi()
{
    try
    {
        const response =
await fetch(
    "https://82.70.42.199:8443/"
);

        const data =
            await response.json();

        document.getElementById("result").innerText =
            JSON.stringify(data);
    }
    catch(e)
    {
        document.getElementById("result").innerText =
            "Virhe: " + e;
    }
}

</script>

</body>
</html>
