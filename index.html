<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BIG-T-FREE-AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
}

#version{
    position: fixed;
    top: 10px;
    right: 10px;
    background: #ffff99;
    border: 1px solid #666;
    padding: 6px 12px;
    font-weight: bold;
    font-size: 16px;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:400px;
    margin-top:20px;
    padding:10px;
    font-family:Consolas, monospace;
    font-size:14px;
}
</style>
</head>

<body>

<div id="version">
VERSION 4
</div>

<h1>BIG-T-FREE-AI</h1>

<div class="row">
    <input
        id="question"
        placeholder="Ask BIG-T-FREE-AI anything">
    <button onclick="askBIGT()">ASK</button>
</div>

<textarea id="answer"></textarea>

<script>

const OWNER = "TuomasKare";
const REPO = "BIG-T-FREE-AI";

/*
PASTE YOUR REAL GITHUB PAT HERE

Example:
const TOKEN = "github_pat_xxxxxxxxxxxxxxxxxxxxxx";
*/

const TOKEN = "PASTE_YOUR_GITHUB_PAT_HERE";

async function askBIGT()
{
    const answerBox =
        document.getElementById("answer");

    answerBox.value =
`VERSION 4

Repository: ${OWNER}/${REPO}

Token length: ${TOKEN.length}

Starting workflow...
`;

    try
    {
        const response =
            await fetch(
                `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/BIG-T-FREE-AI.yml/dispatches`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${TOKEN}`,
                        "Accept": "application/vnd.github+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        ref: "main",
                        inputs: {
                            question:
                                document.getElementById("question").value
                        }
                    })
                }
            );

        const text =
            await response.text();

        answerBox.value +=
`\nHTTP Status: ${response.status}

Response:

${text}
`;

    }
    catch(error)
    {
        answerBox.value +=
`\nERROR:

${error}
`;
    }
}

</script>

</body>
</html>
`
