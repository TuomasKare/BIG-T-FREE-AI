<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BIG-T-FREE-AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:400px;
    margin-top:20px;
    padding:10px;
    font-size:14px;
}
</style>
</head>

<body>

<h1>BIG-T-FREE-AI</h1>

<div class="row">
    <input
        id="question"
        type="text"
        placeholder="Ask BIG-T-FREE-AI anything">
    <button onclick="askBIGT()">ASK</button>
</div>

<textarea id="answer" readonly></textarea>

<script>

const OWNER = "TuomasKare";
const REPO = "BIG-T-FREE-AI";

/*
IMPORTANT:

Replace the text below with your actual GitHub PAT.

Example:
const TOKEN = "github_pat_xxxxxxxxxxxxx";
*/

const TOKEN = "PASTE_YOUR_GITHUB_PAT_HERE";

async function triggerWorkflow(question)
{
    const response = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/BIG-T-FREE-AI.yml/dispatches`,
        {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${TOKEN}`,
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                ref: "main",
                inputs: {
                    question: question
                }
            })
        }
    );

    const text = await response.text();

    console.log("Status:", response.status);
    console.log("Response:", text);

    if (!response.ok)
    {
        throw new Error(
            `GitHub Error ${response.status}\n\n${text}`
        );
    }
}

async function readAnswer()
{
    const response = await fetch(
        `answer.json?t=${Date.now()}`
    );

    const data = await response.json();

    document.getElementById("answer").value =
        data.answer;
}

async function askBIGT()
{
    const question =
        document.getElementById("question").value.trim();

    if(question.length === 0)
        return;

    document.getElementById("answer").value =
        "BIG-T-FREE-AI is thinking...";

    try
    {
        await triggerWorkflow(question);

        document.getElementById("answer").value =
            "Workflow started successfully";

        let attempts = 0;

        const poll = setInterval(async function()
        {
            attempts++;

            try
            {
                await readAnswer();
            }
            catch(err)
            {
                console.log(err);
            }

            if(attempts > 24)
            {
                clearInterval(poll);
            }

        }, 5000);

    }
    catch(err)
    {
        document.getElementById("answer").value =
            err.message;
    }
}

window.onload = function()
{
    readAnswer().catch(console.log);
};

</script>

</body>
</html>
