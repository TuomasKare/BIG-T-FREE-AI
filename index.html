<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BIG-T-FREE-AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
}

#version{
    position: fixed;
    top: 10px;
    right: 10px;
    background: #ffff99;
    border: 1px solid #666;
    padding: 6px 12px;
    font-weight: bold;
    font-size: 16px;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:400px;
    margin-top:20px;
    padding:10px;
    font-family:Consolas, monospace;
    font-size:14px;
}
</style>
</head>

<body>

<div id="version"></div>

<h1>BIG-T-FREE-AI</h1>

<div class="row">
    <input id="question" placeholder="Ask BIG-T-FREE-AI anything">
    <button onclick="askBIGT()">ASK</button>
</div>

<textarea id="answer"></textarea>

<script>
// Build number
const d = new Date(document.lastModified);
document.getElementById("version").innerText =
    "Build " +
    d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0') +
    "." +
    String(d.getHours()).padStart(2,'0') +
    String(d.getMinutes()).padStart(2,'0');

// Ask Oracle server
async function askBIGT()
{
    const answerBox = document.getElementById("answer");
    const question = document.getElementById("question").value;

    answerBox.value = "Kysytään Oracle-serveriltä...\n";

    try {
        const response = await fetch("https://82.70.42.199:8443/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question })
        });

        const data = await response.json();

        answerBox.value += "\nVastaus:\n\n" + data.answer;
    }
    catch (e) {
        answerBox.value += "\nVirhe: " + e;
    }
}
</script>

</body>
</html>
