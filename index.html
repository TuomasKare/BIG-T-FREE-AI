<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BIG-T-FREE-AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
}

h2{
    margin-bottom:20px;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:400px;
    margin-top:20px;
    padding:10px;
    font-size:14px;
}
</style>
</head>

<body>

<h2>BIG-T-FREE-AI</h2>

<div class="row">
    <input id="question" placeholder="Ask BIG-T-FREE-AI anything">
    <button onclick="askBIGT()">ASK</button>
</div>

<textarea id="answer" readonly></textarea>

<script>

const OWNER = "TuomasKare";
const REPO = "BIG-T-FREE-AI";

/*
   Personal Access Token
   Needs:
   - Actions: Read & Write
   - Contents: Read
*/
const TOKEN = "YOUR_GITHUB_PAT";

async function triggerWorkflow(question)
{
    const response = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/BIG-T-FREE-AI.yml/dispatches`,
        {
            method:"POST",
            headers:{
                "Authorization":`Bearer ${TOKEN}`,
                "Accept":"application/vnd.github+json",
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                ref:"main",
                inputs:{
                    question:question
                }
            })
        }
    );

    if(!response.ok)
    {
        throw new Error("Failed to start workflow");
    }
}

async function readAnswer()
{
    const response = await fetch(
        `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/answer.json?t=${Date.now()}`
    );

    const data = await response.json();

    document.getElementById("answer").value =
        data.answer;
}

async function askBIGT()
{
    const question =
        document.getElementById("question").value.trim();

    if(question === "")
        return;

    document.getElementById("answer").value =
        "BIG-T-FREE-AI is thinking...";

    try
    {
        await triggerWorkflow(question);

        let attempts = 0;

        const poll = setInterval(async () =>
        {
            attempts++;

            try
            {
                await readAnswer();

                const answer =
                    document.getElementById("answer").value;

                if(answer !== "BIG-T-FREE-AI is thinking...")
                {
                    clearInterval(poll);
                }
            }
            catch(e)
            {
                console.log(e);
            }

            if(attempts > 24)
            {
                clearInterval(poll);

                document.getElementById("answer").value =
                    "Timeout waiting for answer.";
            }

        }, 5000);

    }
    catch(error)
    {
        document.getElementById("answer").value =
            error.message;
    }
}

window.onload = readAnswer;

</script>

</body>
</html>
