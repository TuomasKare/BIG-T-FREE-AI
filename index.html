<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BIG-T-FREE-AI</title>

<style>
body{
    font-family: Arial,sans-serif;
    max-width:1000px;
    margin:40px auto;
}

#version{
    position:fixed;
    top:10px;
    right:10px;
    background:#eee;
    padding:5px 10px;
    border:1px solid #ccc;
}

.row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
}

textarea{
    width:100%;
    height:400px;
    margin-top:20px;
}
</style>
</head>

<body>

<div id="version">
VERSION 2
</div>

<h1>BIG-T-FREE-AI</h1>

<div class="row">
    <input id="question" placeholder="Ask BIG-T-FREE-AI anything">
    <button onclick="askBIGT()">ASK</button>
</div>

<textarea id="answer"></textarea>

<script>

const OWNER = "TuomasKare";
const REPO = "BIG-T-FREE-AI";

/*
PASTE YOUR REAL GITHUB TOKEN HERE
*/
const TOKEN = "PASTE_YOUR_REAL_TOKEN_HERE";

async function askBIGT()
{
    const answerBox =
        document.getElementById("answer");

    answerBox.value =
        "Version 2\n\n";

    answerBox.value +=
        "Token length: " +
        TOKEN.length +
        "\n\n";

    try {

        const response =
            await fetch(
                `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/BIG-T-FREE-AI.yml/dispatches`,
                {
                    method:"POST",
                    headers:{
                        "Authorization":
                            `Bearer ${TOKEN}`,
                        "Accept":
                            "application/vnd.github+json",
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        ref:"main",
                        inputs:{
                            question:
                                document.getElementById("question").value
                        }
                    })
                }
            );

        const text =
            await response.text();

        answerBox.value +=
            "Status: " +
            response.status +
            "\n\n" +
            text;

    }
    catch(err)
    {
        answerBox.value =
            err.toString();
    }
}

</script>

</body>
</html>
